name: ci
on: [push, pull_request]
permissions:
  contents: read
env:
  UV_NO_SYNC: "1"  # keep torch out of CI: only the explicit sync below runs
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      RUN_MODE: replay
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # no floating major tags since v8
        with:
          python-version: "3.11"
      - run: uv sync --frozen --no-group ml
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - run: uv run python evals/run_evals.py
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm run lint --prefix web
      - uses: astral-sh/setup-uv@v10.2.0  # no floating major tags since v8
        with:
          python-version: "3.11"
      - run: uv sync --frozen --no-group ml
      - run: uv run luciaread export web/public
      - run: VITE_STATIC=1 npm run build --prefix web
